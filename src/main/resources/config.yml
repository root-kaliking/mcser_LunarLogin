# =====================================================
# AuthMeDemo 配置文件
# 所有提示消息、安全参数均从此读取，禁止在代码中硬编码中文
# 颜色代码使用 § 符号，例如 §a=绿色 §c=红色 §e=黄色 §b=水蓝
# =====================================================

# --------------------------
# 【重要】功能总开关
# --------------------------
settings:
  # 是否开启新玩家注册功能
  # true = 允许玩家使用 /register 命令自行注册（首次安装建议开启）
  # false = 关闭注册入口，玩家只能通过管理员 /adminauthme setpassword 强制设置密码（防机器人刷号）
  allow-registration: true

  # 是否强制锁定未登录玩家到出生点
  # true  = 进服立即传送到出生点，并每 tick 强制拉回原地，完全不让移动（最严格）
  # false = 仅取消移动事件（玩家可能被活塞/水流/爆炸推动）
  force-spawn-location: true

  # 重复提示间隔（单位：秒）
  # 未登录/未注册的玩家会每隔 N 秒在聊天框看到一次登录或注册提示
  # AuthMe 默认 3 秒，建议 2~5 秒（太频繁会刷屏）
  prompt-repeat-interval: 3

# --------------------------
# 安全配置
# --------------------------
security:
  # 密码最小长度（位数）
  min-password-length: 4
  # 连续登录失败次数上限，超过后触发冷却（防暴力破解）
  max-login-fails: 5
  # 登录失败冷却时间（单位：秒）
  login-cooldown-seconds: 60

# --------------------------
# 数据库配置（SQLite）
# --------------------------
database:
  # SQLite数据库文件名（放在插件目录下）
  filename: "authme.db"

# --------------------------
# 消息配置（全部中文！禁止英文！）
# 支持占位符：{player} 玩家名  {min} 最小密码位数  {seconds} 剩余秒数
# --------------------------
messages:

  # ========== 加入服务器 / 重复提示消息 ==========
  # 已注册但未登录 - 重复提示用（告诉玩家怎么输命令）
  prompt-login:
    - ""
    - "§b=============== §6请登录 §b==============="
    - "§e请在聊天框输入以下命令后回车："
    - "§a/login <你的密码>"
    - "§7示例：§7/login 123456"
    - "§b========================================"
    - ""
  # 未注册 - 重复提示用（告诉玩家怎么输命令）
  prompt-register:
    - ""
    - "§b============ §6请先注册账号 §b============"
    - "§e请在聊天框输入以下命令后回车："
    - "§a/register <设置密码> <再次输入密码>"
    - "§7示例：§7/register 123456 123456"
    - "§b========================================"
    - ""
  # 注册被关闭的提示
  registration-closed:
    - "§c============ 注册已关闭 ============="
    - "§c服务器已关闭自行注册功能。"
    - "§c请联系管理员为你设置账号密码！"
    - "§c====================================="
  already-logged-in: "§a你已经登录成功了！"

  # ========== 注册命令相关 ==========
  register-success:
    - ""
    - "§a■■■■■■■■■■ 注册成功 ■■■■■■■■■■"
    - "§a欢迎加入服务器！你已自动登录。"
    - "§a祝你游戏愉快！"
    - "§a■■■■■■■■■■■■■■■■■■■■■■■■■■■■■"
    - ""
  register-already: "§c你已经注册过账号了！请直接使用 /login 密码 登录。"
  register-password-mismatch: "§c两次输入的密码不一致！请重新输入：/register 密码 确认密码"
  register-password-too-short: "§c密码太短了！最少需要 {min} 位数字或字母。"
  register-usage: "§c正确用法：/register 你的密码 再次输入密码   例如：/register 123456 123456"

  # ========== 登录命令相关 ==========
  login-success:
    - ""
    - "§a■■■■■■■■■■ 登录成功 ■■■■■■■■■■"
    - "§a欢迎回来，{player}！"
    - "§a现在你可以自由移动、聊天、游戏了！"
    - "§a■■■■■■■■■■■■■■■■■■■■■■■■■■■■"
    - ""
  login-failed: "§c密码错误！请重新输入 /login 密码。注意密码大小写！"
  login-not-registered: "§c你还没有注册！请先输入命令 /register 密码 确认密码 进行注册。"
  login-already: "§c你已经登录过了，无需重复登录。"
  login-usage: "§c正确用法：/login 你的密码   例如：/login 123456"
  login-too-many-fails: "§c连续输错密码次数过多！账号被暂时封禁，请等待 {seconds} 秒后再试。"
  login-cooldown: "§c账号正在冷却中！还需等待 {seconds} 秒才能再次尝试登录。"

  # ========== 修改密码相关 ==========
  changepassword-success: "§a密码修改成功！下次登录请使用新密码。"
  changepassword-old-wrong: "§c旧密码错误！请确认后重试。"
  changepassword-password-too-short: "§c新密码太短了！最少需要 {min} 位。"
  changepassword-not-logged-in: "§c请先登录后再修改密码！"
  changepassword-usage: "§c正确用法：/changepassword 旧密码 新密码"

  # ========== 登出相关 ==========
  logout-success: "§e你已成功退出登录！请使用 /login 密码 重新登录。"
  logout-not-logged-in: "§c你还没有登录，不需要登出！"

  # ========== 管理员命令相关 ==========
  admin-setpassword-success: "§a管理员操作成功：已为玩家 {player} 重置密码！该玩家如果在线会被踢下线，要求用新密码重登。"
  admin-player-not-found: "§c没找到玩家「{player}」的账号数据！确认玩家名输入正确（不区分大小写）。"
  admin-usage: "§c正确用法：/adminauthme setpassword 玩家名 新密码"
  admin-password-too-short: "§c新密码太短了！最少需要 {min} 位。"

  # ========== 未登录时的动作拦截提示 ==========
  not-logged-in-blocked: "§c§l请先注册或登录后再操作！输入命令：/register 或 /login"
  not-logged-in-chat: "§c§l请先注册或登录后再聊天！输入命令：/register 或 /login"
  not-logged-in-command: "§c§l未登录状态只允许使用 /login 和 /register 命令！"
  not-logged-in-move: "§c§l请先注册或登录！输入命令后才能移动。"

  # ========== 其他 ==========
  kick-for-vulnerability: "§c§l管理员已重置你的密码！请断开连接后使用新密码重新登录。"
  database-error: "§c服务器内部数据库错误！请联系服主或稍后重试。"
