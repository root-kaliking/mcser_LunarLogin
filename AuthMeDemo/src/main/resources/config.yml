# =====================================================
# AuthMeDemo 配置文件
# 所有提示消息、安全参数均从此读取，禁止在代码中硬编码
# 颜色代码使用 § 符号，例如 §a=绿色 §c=红色 §e=黄色
# =====================================================

# --------------------------
# 安全配置
# --------------------------
security:
  # 密码最小长度
  min-password-length: 4
  # 连续登录失败次数上限，超过后触发冷却
  max-login-fails: 5
  # 登录失败冷却时间（单位：秒）
  login-cooldown-seconds: 60

# --------------------------
# 数据库配置（SQLite）
# --------------------------
database:
  # SQLite数据库文件名（放在插件目录下）
  filename: "authme.db"

# --------------------------
# 消息配置：所有提示文本
# 支持 {player} 占位符 (玩家名)
# --------------------------
messages:
  # ===== 加入服务器提示 =====
  join-registered: "§e请使用 §a/login <密码> §e登录你的账号！"
  join-unregistered: "§e你还未注册，请使用 §a/register <密码> <确认密码> §e注册账号！"
  already-logged-in: "§a你已经登录成功了！"

  # ===== 注册相关 =====
  register-success: "§a注册成功！你已自动登录，祝你游戏愉快！"
  register-already: "§c你已经注册过了！请直接登录。"
  register-password-mismatch: "§c两次输入的密码不一致！"
  register-password-too-short: "§c密码太短了！最少需要 {min} 位。"
  register-usage: "§c用法：/register <密码> <确认密码>"

  # ===== 登录相关 =====
  login-success: "§a登录成功！欢迎回来，{player}！"
  login-failed: "§c密码错误！请重试。"
  login-not-registered: "§c你还没有注册！请先使用 /register 注册。"
  login-already: "§c你已经登录过了！"
  login-usage: "§c用法：/login <密码>"
  login-too-many-fails: "§c登录失败次数过多！请等待 {seconds} 秒后再试。"
  login-cooldown: "§c请等待 {seconds} 秒后再尝试登录。"

  # ===== 修改密码相关 =====
  changepassword-success: "§a密码修改成功！"
  changepassword-old-wrong: "§c旧密码错误！"
  changepassword-password-too-short: "§c新密码太短了！最少需要 {min} 位。"
  changepassword-not-logged-in: "§c请先登录后再修改密码！"
  changepassword-usage: "§c用法：/changepassword <旧密码> <新密码>"

  # ===== 登出相关 =====
  logout-success: "§e你已成功退出登录！请重新使用 /login 登录。"
  logout-not-logged-in: "§c你还没有登录！"

  # ===== 管理员相关 =====
  admin-setpassword-success: "§a已为玩家 {player} 重置密码！"
  admin-player-not-found: "§c未找到玩家 {player} 的账号数据！"
  admin-usage: "§c用法：/adminauthme setpassword <玩家名> <新密码>"
  admin-password-too-short: "§c新密码太短了！最少需要 {min} 位。"

  # ===== 未登录时拦截提示 =====
  not-logged-in-blocked: "§c请先登录或注册后再操作！"
  not-logged-in-chat: "§c请先登录或注册后再聊天！"
  not-logged-in-command: "§c请先登录或注册！仅允许使用 /login 和 /register 命令。"
  not-logged-in-move: "§c请先登录或注册后再移动！输入 /login 或 /register"

  # ===== 其他 =====
  kick-for-vulnerability: "§c出于安全原因，请重新登录！"
  database-error: "§c数据库错误，请联系管理员！"
