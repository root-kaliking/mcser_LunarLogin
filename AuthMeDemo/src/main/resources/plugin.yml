# ========================================
# 插件描述文件 plugin.yml
# Spigot/Paper 服务端加载插件的依据
# ========================================

# 插件名称（与pom.xml中artifactId对应）
name: AuthMeDemo
# 插件版本
version: ${project.version}
# 主类：服务端启动时实例化的入口类
main: com.authmedemo.AuthMeDemo
# API版本：指定使用的Bukkit API版本（1.13+使用）
api-version: 1.16
# 作者信息
author: AuthMeDemo
# 插件描述
description: 参考AuthMeReloaded实现的离线服务器登录插件Demo

# ========================================
# 本插件注册的所有命令
# 命令名 -> 对应参数配置
# ========================================
commands:
  # /register 注册命令
  register:
    description: 注册账号
    usage: /register <密码> <确认密码>
    aliases: [reg]
  # /login 登录命令
  login:
    description: 登录账号
    usage: /login <密码>
    aliases: [l]
  # /changepassword 修改密码命令
  changepassword:
    description: 修改密码
    usage: /changepassword <旧密码> <新密码>
    aliases: [cpw, changepw]
  # /logout 登出命令
  logout:
    description: 退出登录
    usage: /logout
  # /adminauthme 管理员命令
  adminauthme:
    description: AuthMe管理员命令
    usage: /adminauthme setpassword <玩家> <新密码>
    permission: authme.admin
    permission-message: §c你没有权限使用此命令

# ========================================
# 权限节点
# ========================================
permissions:
  authme.admin:
    description: AuthMe管理员权限
    default: op
